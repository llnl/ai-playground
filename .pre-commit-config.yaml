repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: '^frontend/tsconfig\.(node|app)\.json$'
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
      - id: check-case-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: name-tests-test
        args: [--pytest-test-first]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--show-fixes]
        name: ruff check --show-fixes >> Fix issues with `ruff check --fix .` from the top of the repo.
      - id: ruff-format
        args: [--check, --diff]
        name: ruff format --check --diff >> Fix issues with `ruff format .` from the top of the repo.

  - repo: https://github.com/aufdenpunkt/pre-commit-js-beautify
    rev: 1.13.0
    hooks:
      - id: js-beautify
        name: js-beautify format HTML
        types: [html]
        files: \.html$
        args:
          - --indent-size=4
          - --end-with-newline
          - --wrap-line-length=120

      - id: js-beautify
        name: js-beautify format CSS
        types: [css]
        files: \.css$
        args:
          - --indent-size=2
          - --end-with-newline
          - --wrap-line-length=120
