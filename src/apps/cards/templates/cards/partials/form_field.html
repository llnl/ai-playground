<div class="form-field{% if field.errors %} form-field--error{% endif %}">
    <label for="{{ field.id_for_label }}">
        {{ field.label }}{% if field.field.required %}<span class="required-marker" aria-hidden="true">
            *</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}<div class="helptext" id="{{ field.id_for_label }}_help">{{ field.help_text }}</div>
    {% endif %}
    {% if field.errors %}
    <ul class="errorlist" id="{{ field.id_for_label }}_errors">
        {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
    {% endif %}
</div>
